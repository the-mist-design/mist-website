[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The brief page was renamed; keep old links and QR codes working.
[[redirects]]
  from = "/the-positioning-brief/*"
  to = "/the-gap-review/"
  status = 301

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
